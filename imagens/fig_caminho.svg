<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1600" height="900" fill="#fff"/>
<text x="60" y="66" font-size="40" font-weight="900" fill="#1d1d1b">Da dúvida à decisão</text>
<text x="60" y="102" font-size="22" fill="#8a8a86">o protocolo abreviado tem oito peças; a defesa oral dá o passo seguinte</text>
<rect x="60.0" y="140" width="352.0" height="200" fill="none" stroke="#1d1d1b" stroke-width="3"/>
<text x="78.0" y="208" font-size="60" font-weight="900" fill="#1d1d1b">1</text>
<text x="150.0" y="208" font-size="28" font-weight="700" fill="#1d1d1b">A dúvida</text>
<text x="78.0" y="258" font-size="22" fill="#1d1d1b">de onde veio, em duas</text>
<text x="78.0" y="286" font-size="22" fill="#1d1d1b">frases</text>
<line x1="415.0" y1="240.0" x2="433.0" y2="240.0" stroke="#1d1d1b" stroke-width="3"/>
<rect x="436.0" y="140" width="352.0" height="200" fill="none" stroke="#1d1d1b" stroke-width="3"/>
<text x="454.0" y="208" font-size="60" font-weight="900" fill="#1d1d1b">2</text>
<text x="526.0" y="208" font-size="28" font-weight="700" fill="#1d1d1b">A pergunta</text>
<text x="454.0" y="258" font-size="22" fill="#1d1d1b">PICO(T) ou PESICO, peça a</text>
<text x="454.0" y="286" font-size="22" fill="#1d1d1b">peça</text>
<line x1="791.0" y1="240.0" x2="809.0" y2="240.0" stroke="#1d1d1b" stroke-width="3"/>
<rect x="812.0" y="140" width="352.0" height="200" fill="#e8ff47" stroke="#1d1d1b" stroke-width="3"/>
<text x="830.0" y="208" font-size="60" font-weight="900" fill="#1d1d1b">3</text>
<text x="902.0" y="208" font-size="28" font-weight="700" fill="#1d1d1b">O que já se sabe</text>
<text x="830.0" y="258" font-size="22" fill="#1d1d1b">uma revisão publicada, com</text>
<text x="830.0" y="286" font-size="22" fill="#1d1d1b">números</text>
<line x1="1167.0" y1="240.0" x2="1185.0" y2="240.0" stroke="#1d1d1b" stroke-width="3"/>
<rect x="1188.0" y="140" width="352.0" height="200" fill="none" stroke="#1d1d1b" stroke-width="3"/>
<text x="1206.0" y="208" font-size="60" font-weight="900" fill="#1d1d1b">4</text>
<text x="1278.0" y="208" font-size="28" font-weight="700" fill="#1d1d1b">Elegibilidade</text>
<text x="1206.0" y="258" font-size="22" fill="#1d1d1b">cinco linhas, cinco</text>
<text x="1206.0" y="286" font-size="22" fill="#1d1d1b">porquês</text>
<rect x="60.0" y="374" width="352.0" height="200" fill="#e8ff47" stroke="#1d1d1b" stroke-width="3"/>
<text x="78.0" y="442" font-size="60" font-weight="900" fill="#1d1d1b">5</text>
<text x="150.0" y="442" font-size="28" font-weight="700" fill="#1d1d1b">A pesquisa</text>
<text x="78.0" y="492" font-size="22" fill="#1d1d1b">string, data, n; vinte</text>
<text x="78.0" y="520" font-size="22" fill="#1d1d1b">títulos triados</text>
<line x1="415.0" y1="474.0" x2="433.0" y2="474.0" stroke="#1d1d1b" stroke-width="3"/>
<rect x="436.0" y="374" width="352.0" height="200" fill="none" stroke="#1d1d1b" stroke-width="3"/>
<text x="454.0" y="442" font-size="60" font-weight="900" fill="#1d1d1b">6</text>
<text x="526.0" y="442" font-size="28" font-weight="700" fill="#1d1d1b">Risco de viés</text>
<text x="454.0" y="492" font-size="22" fill="#1d1d1b">o instrumento certo, numa</text>
<text x="454.0" y="520" font-size="22" fill="#1d1d1b">frase</text>
<line x1="791.0" y1="474.0" x2="809.0" y2="474.0" stroke="#1d1d1b" stroke-width="3"/>
<rect x="812.0" y="374" width="352.0" height="200" fill="none" stroke="#1d1d1b" stroke-width="3"/>
<text x="830.0" y="442" font-size="60" font-weight="900" fill="#1d1d1b">7</text>
<text x="902.0" y="442" font-size="28" font-weight="700" fill="#1d1d1b">Síntese</text>
<text x="830.0" y="492" font-size="22" fill="#1d1d1b">narrativa ou meta-análise,</text>
<text x="830.0" y="520" font-size="22" fill="#1d1d1b">e porquê</text>
<line x1="1167.0" y1="474.0" x2="1185.0" y2="474.0" stroke="#1d1d1b" stroke-width="3"/>
<rect x="1188.0" y="374" width="352.0" height="200" fill="none" stroke="#1d1d1b" stroke-width="3"/>
<text x="1206.0" y="442" font-size="60" font-weight="900" fill="#1d1d1b">8</text>
<text x="1278.0" y="442" font-size="28" font-weight="700" fill="#1d1d1b">Integridade</text>
<text x="1206.0" y="492" font-size="22" fill="#1d1d1b">IA declarada, referências</text>
<text x="1206.0" y="520" font-size="22" fill="#1d1d1b">com DOI</text>
<rect x="60" y="618" width="1480" height="150" fill="none" stroke="#1d1d1b" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="78" y="640" width="360" height="46" fill="#ffb0d6"/>
<text x="88" y="673" font-size="30" font-weight="900" fill="#1d1d1b">Defesa oral: e agora?</text>
<text x="78" y="716" font-size="22" fill="#1d1d1b">cenário e pergunta; o método defendido; o que a evidência de hoje diz, com números;</text>
<text x="78" y="746" font-size="22" fill="#1d1d1b">a decisão de hoje, e o que o protocolo acrescentaria.</text>
<text x="1540" y="878" font-size="16" fill="#8a8a86" text-anchor="end">MPTF II 2026/27, enunciado do trabalho. Figura da docente.</text>
</svg>