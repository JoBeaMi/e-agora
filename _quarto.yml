project:
  type: book
  output-dir: _book

lang: pt-PT

book:
  title: "Ler artigos em terapia da fala"
  subtitle: "Desconfiar de números, perceber o que foi feito, escrever um protocolo"
  author:
    - name: Joana Miguel
      email: joana.miguel@caidi.pt
  date: today
  date-format: "D MMMM YYYY"
  license: CC BY-NC-SA
  site-url: https://joanamiguel.pt/mptf-ii/
  repo-url: https://github.com/JoBeaMi/mptf-ii
  repo-branch: main
  reader-mode: true
  sidebar:
    title: Ler artigos<br>em terapia da fala
    subtitle: Joana Miguel, em construção
    tools:
      - icon: envelope
        href: mailto:joana.miguel@caidi.pt
  page-footer:
    background: light
    left: Joana Miguel
    center: Ler artigos em terapia da fala
    right: <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt">CC BY-NC-SA</a>
  chapters:
    - index.qmd
    - como-usar.qmd
    # Parte I. Ler números (capítulos entram à medida que ficam prontos)
    # - part: "Ler números"
    #   chapters:
    #     - 01-ler-um-resultado.qmd
    #     - 02-descrever-e-desconfiar.qmd
    #     - 03-o-valor-p.qmd
    # Parte II. Do problema ao protocolo
    # - part: "Do problema ao protocolo"
    #   chapters:
    #     - 04-da-duvida-a-pergunta.qmd
    #     - 05-etica-e-tipos-de-estudo.qmd
    #     - 06-pbe-e-analise-critica.qmd
    #     - 07-revisao-sistematica.qmd
    - part: "Percursos"
      chapters:
        - percursos/mptf-ii-2026.qmd
    - referencias.qmd
  appendices:
    - glossario.qmd

bibliography: referencias.bib
csl: apa.csl

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style.css
    include-in-header:
      - text: '<script src="quiz.js"></script>'
    toc: true
    toc-depth: 3
    number-sections: true
    link-external-newwindow: true
    footnotes-hover: true
    lightbox: true
